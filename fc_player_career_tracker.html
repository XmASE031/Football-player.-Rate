    function SvgRadarChart({ datasets, size = 260 }) {
      const center = size / 2;
      const radius = size * 0.35;
      const categories = ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'];
      const angleStep = (Math.PI * 2) / categories.length;

      const getCoordinates = (index, value) => {
        const angle = index * angleStep - Math.PI / 2;
        const r = (value / 100) * radius;
        return {
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle)
        };
      };

      const gridLevels = [0.25, 0.5, 0.75, 1.0];

      return (
        <svg width={size} height={size} className="w-full h-full">
          {/* Background Web Grid */}
          {gridLevels.map((level, idx) => {
            const points = categories.map((_, i) => {
              const coords = getCoordinates(i, 100 * level);
              return `${coords.x},${coords.y}`;
            }).join(' ');
            return (
              <polygon key={idx} points={points} fill="none" stroke="#262626" strokeWidth="1" strokeDasharray={level === 1 ? 'none' : '2 2'} />
            );
          })}

          {/* Axis Lines & Text Labels */}
          {categories.map((cat, i) => {
            const outer = getCoordinates(i, 100);
            const labelPos = getCoordinates(i, 118);
            return (
              <g key={cat}>
                <line x1={center} y1={center} x2={outer.x} y2={outer.y} stroke="#262626" strokeWidth="1" />
                <text x={labelPos.x} y={labelPos.y} fill="#d4d4d4" fontSize="11" fontWeight="bold" textAnchor="middle" dominantBaseline="central">
                  {cat}
                </text>
              </g>
            );
          })}

          {/* Player Radar Polygons */}
          {datasets.map((ds, dIdx) => {
            const points = categories.map((cat, i) => {
              const val = ds.data[cat] || 0;
              const coords = getCoordinates(i, val);
              return `${coords.x},${coords.y}`;
            }).join(' ');

            return (
              <g key={dIdx}>
                <polygon points={points} fill={ds.color} fillOpacity="0.25" stroke={ds.color} strokeWidth="2" />
                {categories.map((cat, i) => {
                  const val = ds.data[cat] || 0;
                  const coords = getCoordinates(i, val);
                  return <circle key={i} cx={coords.x} cy={coords.y} r="3" fill={ds.color} />;
                })}
              </g>
            );
          })}
        </svg>
      );
    }

    function SvgLineChart({ series, height = 220 }) {
      if (!series || series.length === 0) return null;

      // Extract all numeric points across series
      let allPoints = [];
      series.forEach(s => {
        s.data.forEach(d => {
          if (typeof d.OVR === 'number') allPoints.push(d.OVR);
        });
      });

      const minVal = allPoints.length ? Math.min(...allPoints) - 2 : 70;
      const maxVal = allPoints.length ? Math.max(...allPoints) + 2 : 90;
      const maxLen = Math.max(...series.map(s => s.data.length), 1);

      const svgWidth = 500;
      const svgHeight = height;
      const padding = 35;

      const getX = (idx) => {
        if (maxLen <= 1) return svgWidth / 2;
        return padding + (idx / (maxLen - 1)) * (svgWidth - padding * 2);
      };

      const getY = (val) => {
        const range = maxVal - minVal || 1;
        return svgHeight - padding - ((val - minVal) / range) * (svgHeight - padding * 2);
      };

      return (
        <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full h-full overflow-visible">
          {/* Horizontal Grid lines */}
          {[0, 0.33, 0.66, 1].map((ratio, i) => {
            const y = padding + ratio * (svgHeight - padding * 2);
            const val = Math.round(maxVal - ratio * (maxVal - minVal));
            return (
              <g key={i}>
                <line x1={padding} y1={y} x2={svgWidth - padding} y2={y} stroke="#262626" strokeDasharray="3 3" />
                <text x={padding - 8} y={y + 4} fill="#525252" fontSize="10" textAnchor="end">{val}</text>
              </g>
            );
          })}

          {/* Series Lines and Circles */}
          {series.map((s, sIdx) => {
            const pts = s.data.map((d, i) => ({ x: getX(i), y: getY(d.OVR), val: d.OVR, label: d.name }));
            const pathD = pts.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');

            return (
              <g key={sIdx}>
                <path d={pathD} fill="none" stroke={s.color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                {pts.map((p, i) => (
                  <g key={i} className="group cursor-pointer">
                    <circle cx={p.x} cy={p.y} r="4" fill="#09090b" stroke={s.color} strokeWidth="2" />
                    <text x={p.x} y={svgHeight - 10} fill="#737373" fontSize="9" textAnchor="middle">{p.label}</text>
                    <text x={p.x} y={p.y - 8} fill={s.color} fontSize="10" fontWeight="bold" textAnchor="middle">{p.val}</text>
                  </g>
                ))}
              </g>
            );
          })}
        </svg>
      );
    }

    function App() {
      const [lang, setLang] = useState('zh');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toastMessage, setToastMessage] = useState(null);

      const t = (key) => TRANSLATIONS[lang][key] || key;

      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('fc_career_players_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return DEFAULT_PLAYERS;
      });

      const [activePlayerId, setActivePlayerId] = useState(() => players[0]?.id || 'player_1');
      const [selectedCompareIds, setSelectedCompareIds] = useState(() => {
        return players.slice(0, 3).map(p => p.id);
      });

      useEffect(() => {
        localStorage.setItem('fc_career_players_v2', JSON.stringify(players));
      }, [players]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const activePlayer = useMemo(() => {
        return players.find(p => p.id === activePlayerId) || players[0];
      }, [players, activePlayerId]);

      const getGrowthData = (player) => {
        if (!player) return [];
        let baseSub = { ...player.subStats };
        
        player.matches.slice().reverse().forEach(m => {
          Object.keys(m.subChanges || {}).forEach(k => {
            baseSub[k] = (baseSub[k] || 70) - (m.subChanges[k] || 0);
          });
        });

        const data = [{ name: lang === 'zh' ? '初始' : 'Init', OVR: calculateOVR(baseSub), ...calculateCategoryStats(baseSub) }];
        let runningSub = { ...baseSub };

        player.matches.forEach((m, idx) => {
          Object.keys(m.subChanges || {}).forEach(k => {
            runningSub[k] = (runningSub[k] || 70) + (m.subChanges[k] || 0);
          });
          data.push({
            name: `M${idx + 1}`,
            OVR: calculateOVR(runningSub),
            ...calculateCategoryStats(runningSub)
          });
        });
        return data;
      };

      const handleAddNewPlayer = (newProfile) => {
        const newPlayer = {
          id: `player_${Date.now()}`,
          profile: newProfile,
          subStats: { ...DEFAULT_SUB_STATS_ALEX },
          matches: []
        };
        setPlayers(prev => [...prev, newPlayer]);
        setActivePlayerId(newPlayer.id);
        if (selectedCompareIds.length < 4) {
          setSelectedCompareIds(prev => [...prev, newPlayer.id]);
        }
        showToast(`${t('playerDatabase')} + ${newProfile.name}`);
      };

      const handleDeletePlayer = (id) => {
        if (players.length <= 1) {
          showToast(lang === 'zh' ? '至少需要保留一名球员档案' : 'At least 1 player required');
          return;
        }
        const filtered = players.filter(p => p.id !== id);
        setPlayers(filtered);
        if (activePlayerId === id) setActivePlayerId(filtered[0].id);
        setSelectedCompareIds(prev => prev.filter(cId => cId !== id));
        showToast(lang === 'zh' ? '已移除该球员档案' : 'Player removed');
      };

      const handleUpdatePlayerProfile = (updatedProfile) => {
        setPlayers(prev => prev.map(p => {
          if (p.id === activePlayer.id) return { ...p, profile: updatedProfile };
          return p;
        }));
        showToast(t('updateProfile'));
      };

      const handleAddMatch = (matchData, updatedSubStats) => {
        setPlayers(prev => prev.map(p => {
          if (p.id === activePlayer.id) {
            return {
              ...p,
              subStats: updatedSubStats,
              matches: [...p.matches, matchData]
            };
          }
          return p;
        }));
        showToast(lang === 'zh' ? '比赛记录已保存，数值已更新！' : 'Match logged & attributes updated!');
        setActiveTab('history');
      };

      const handleExportData = () => {
        const dataStr = JSON.stringify(players, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `FC_Career_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(t('exportData'));
      };

      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported) && imported.length > 0) {
              setPlayers(imported);
              setActivePlayerId(imported[0].id);
              setSelectedCompareIds(imported.slice(0, 3).map(p => p.id));
              showToast('Data imported successfully!');
            }
          } catch (err) {
            showToast('JSON parse error');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="min-h-screen bg-[#09090b] text-neutral-100 font-sans pb-16">
          {/* Header Navigation */}
          <nav className="sticky top-0 z-50 bg-neutral-950/90 backdrop-blur-md border-b border-amber-500/20 px-4 py-3">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
              <div className="flex items-center justify-between w-full md:w-auto gap-4">
                <div className="flex items-center gap-2">
                  <ShieldIcon className="w-7 h-7 text-amber-500" />
                  <span className="text-lg md:text-xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 tracking-wider">
                    {t('appName')}
                  </span>
                </div>

                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setLang(l => l === 'zh' ? 'en' : 'zh')}
                    className="flex items-center gap-1.5 px-2.5 py-1 bg-neutral-900 border border-neutral-800 rounded-lg text-xs font-bold text-amber-400 hover:border-amber-500/50 transition-colors"
                  >
                    <GlobeIcon className="w-3.5 h-3.5 text-amber-500" />
                    <span>{t('switchLang')}</span>
                  </button>

                  <div className="flex items-center gap-1.5 bg-neutral-900 border border-neutral-800 rounded-lg px-2 py-1">
                    <UsersIcon className="w-3.5 h-3.5 text-amber-500" />
                    <select 
                      value={activePlayerId} 
                      onChange={(e) => setActivePlayerId(e.target.value)}
                      className="bg-transparent text-xs font-bold text-amber-100 focus:outline-none cursor-pointer max-w-[130px] truncate"
                    >
                      {players.map(p => (
                        <option key={p.id} value={p.id} className="bg-neutral-900 text-white">
                          {p.profile.name} ({p.profile.position} - {calculateOVR(p.subStats)})
                        </option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>

              <div className="flex justify-around w-full md:w-auto gap-1 md:gap-2">
                {[
                  { id: 'dashboard', icon: TrophyIcon, label: t('dashboard') },
                  { id: 'compare', icon: CompareIcon, label: t('compare') },
                  { id: 'add_match', icon: PlusIcon, label: t('addMatch') },
                  { id: 'history', icon: ActivityIcon, label: t('history') },
                  { id: 'settings', icon: SettingsIcon, label: t('settings') }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold transition-all ${
                      activeTab === item.id 
                        ? 'text-black bg-gradient-to-r from-amber-400 to-yellow-500 shadow-lg shadow-amber-500/20' 
                        : 'text-neutral-400 hover:text-amber-200 hover:bg-neutral-900'
                    }`}
                  >
                    <item.icon className="w-4 h-4" />
                    <span>{item.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </nav>

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-16 right-4 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl border backdrop-blur-md animate-fade-in bg-neutral-900/90 border-amber-500/40 text-amber-200">
              <AlertIcon className="w-5 h-5 text-amber-400" />
              <span className="text-sm font-bold">{toastMessage}</span>
              <button onClick={() => setToastMessage(null)} className="ml-2 text-neutral-400 hover:text-white">
                <XIcon className="w-4 h-4" />
              </button>
            </div>
          )}

          {/* Main View Area */}
          <main className="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
            {activeTab === 'dashboard' && (
              <Dashboard player={activePlayer} growthData={getGrowthData(activePlayer)} t={t} lang={lang} />
            )}

            {activeTab === 'compare' && (
              <MultiCompareView players={players} selectedIds={selectedCompareIds} setSelectedIds={setSelectedCompareIds} getGrowthData={getGrowthData} t={t} lang={lang} />
            )}
            
            {activeTab === 'add_match' && (
              <MatchForm player={activePlayer} onSave={handleAddMatch} t={t} />
            )}
            
            {activeTab === 'history' && (
              <MatchHistory player={activePlayer} t={t} />
            )}
            
            {activeTab === 'settings' && (
              <PlayerManager 
                players={players} 
                activePlayer={activePlayer} 
                setActivePlayerId={setActivePlayerId} 
                onAddNewPlayer={handleAddNewPlayer} 
                onDeletePlayer={handleDeletePlayer} 
                onUpdateProfile={handleUpdatePlayerProfile} 
                onExport={handleExportData} 
                onImport={handleImportData} 
                t={t} 
              />
            )}
          </main>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
